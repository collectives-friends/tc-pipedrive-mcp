# GENERERET af collectives-friends/.github ci-sync/sync.sh. Rediger IKKE her.
# Aendr manifest.json + sync.sh og koer sync paa ny.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      # Lint: udskudt (repo mangler lint-script)
      # Format-check: udskudt (repo mangler format:check-script)
      # Test: udskudt (repo mangler test-suite)
      - name: Build
        run: npm run build
